# Codag JetBrains Plugin — all config via properties, zero hardcode
pluginGroup=com.codag.jetbrains
pluginName=Codag
pluginVersion=0.1.0
pluginDescription=Visualize AI/LLM workflows in your codebase as interactive DAG graphs.
vendorName=Teranveril
vendorUrl=https://github.com/Teranveril
vendorEmail=codag@teranveril.dev

# IntelliJ Platform
platformType=IC
platformVersion=2024.1.7
platformSinceBuild=241
platformUntilBuild=253.*

# Kotlin / JVM
javaVersion=17
kotlinVersion=2.1.0

# Codag backend
codagBackendDefaultUrl=http://localhost:52104

# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.stdlib.default.dependency=false
